
services:
  postgres:
    image: postgres:16-alpine
    container_name: industrial-etl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: industrial_iot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d industrial_iot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_demo_data:
