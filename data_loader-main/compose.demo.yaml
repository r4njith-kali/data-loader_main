
services:
  postgres:
    image: postgres:16-alpine
    container_name: industrial-etl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: industrial_iot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d industrial_iot"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  etl:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      DATABASE_URL: postgresql+psycopg2://etl_user:local_demo_only@postgres:5432/industrial_iot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"


volumes:
  postgres_demo_data:
